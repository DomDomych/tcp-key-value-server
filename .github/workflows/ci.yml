name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            g++ \
            git \
            libboost-all-dev \
            libgtest-dev \
            libpq-dev \
            pkg-config

      - name: Install libpqxx
        run: |
          git clone --depth 1 --branch 7.10.0 https://github.com/jtv/libpqxx.git /tmp/libpqxx
          cmake -S /tmp/libpqxx -B /tmp/libpqxx/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF
          cmake --build /tmp/libpqxx/build -j2
          sudo cmake --install /tmp/libpqxx/build
          sudo ldconfig

      - name: Run tests
        run: ./scripts/full_test.sh