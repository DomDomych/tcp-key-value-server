services:
  postgres:
    image: postgres:16

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    image: tcp-key-value-server:local

    build:
      context: .
      dockerfile: Dockerfile

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "${SERVER_PORT:-8080}:8080"
  
  client:
    image: tcp-key-value-server:local

    profiles:
      - tools
    
    environment:
      SERVER_HOST: server
      SERVER_PORT: 8080
    
    depends_on:
      server:
        condition: service_started

    command: ["./build/kv_client"]

    stdin_open: true
    tty: true

volumes:
  postgres_data: